intent: profession_smile_connection

title: Profession and Smile Connection - Personalized Smile Design Philosophy

purpose: >
  When a user mentions their profession or says they work in a profession where appearance, communication,
  confidence, presentation, or meeting people is important, connect their profession naturally with their smile
  and explain how personalised Smile Design can complement their professional personality.

master_rules:
- Never assume the user's smile is bad.
- Never make the user feel insecure or judged.
- Do not say they NEED treatment.
- Make the connection personal, warm and conversational.
- Use the profession-specific analogy.
- Do not give every profession response unless that profession is relevant.
- Do not simply mention the user's profession and immediately sell Smile Design.
- First connect their profession to something they genuinely experience ("Because of what you do every day, you already understand why this matters.").
- Profession is not the trigger to sell; profession is the bridge to make the Smile Design philosophy personally meaningful.

exploratory_prompt:
  english: "By the way, what do you do for work?"
  hindi: "वैसे, अगर मैं पूछ सकती हूँ, आप क्या काम करते हैं?"
  gujarati: "તેમ છતાં, જો હું પૂછી શકું, તમે શું કામ કરો છો?"

professions:
  receptionist:
    profession: Receptionist
    analogy: "Smile = welcome sign / first impression"
    voice_response: >
      As a receptionist, you meet new people almost every day, and your smile is often part of their first impression of you.
      You may already look confident and professional, but your smile should feel like it belongs with your personality too.
      Think of it as the welcome sign of a place—the first thing people notice. That's why we focus on creating a smile that feels natural to you.

  salesperson:
    profession: Salesperson
    analogy: "Smile = presentation"
    voice_response: >
      As a salesperson, you meet new people, build relationships and create first impressions every day.
      Your smile is part of that interaction. Think of it like your presentation—you want every part of your presentation to represent you naturally.
      That's why we design the smile around your face and personality, rather than simply making the teeth look good.

  teacher:
    profession: Teacher
    analogy: "Smile = communication"
    voice_response: >
      As a teacher, you spend your day speaking, explaining and connecting with people. Your expressions and smile naturally become part of how you communicate.
      Think of your smile as another part of your communication. We focus on making it feel natural with your face and personality, so it supports the way you naturally express yourself.

  doctor:
    profession: Doctor
    analogy: "Smile = trust and reassurance"
    voice_response: >
      As a doctor, people look to you for confidence, trust and reassurance. You communicate with patients face-to-face every day.
      Your smile is part of that first connection. We focus on creating something natural and balanced that complements your professional personality rather than simply creating perfect-looking teeth.

  lawyer:
    profession: Lawyer
    analogy: "Smile = professional presence"
    voice_response: >
      As a lawyer, confidence and presence are important every time you meet a client or speak in front of people.
      Think of your smile as part of your professional presence. A personalised Smile Design can make sure your smile complements the confidence and personality you already carry.

  business_owner:
    profession: Business Owner
    analogy: "Smile = personal brand"
    voice_response: >
      As a business owner, your personality often becomes part of your personal brand. You meet clients, partners and new people all the time.
      Your smile is part of that personal brand too. Think of it like your business identity—we don't want to copy someone else's; we want it to represent you.

  real_estate_agent:
    profession: Real Estate Agent
    analogy: "Smile = a beautiful property where every detail works together"
    voice_response: >
      As a real estate agent, you meet new clients, show properties and build trust face-to-face.
      Think about showing someone a beautiful home—you notice how all the details work together. We take the same approach to your smile, making sure your teeth, gums and overall smile work naturally together.

  hr_professional:
    profession: HR Professional
    analogy: "Smile = human connection"
    voice_response: >
      As an HR professional, you meet and communicate with people every day. Creating a comfortable first connection is a big part of your role.
      Your smile naturally becomes part of that connection. We focus on creating a smile that complements your personality and helps your natural expression come through.

  flight_attendant:

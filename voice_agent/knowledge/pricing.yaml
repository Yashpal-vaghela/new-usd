voice_response:

Every genuine Ultimate Smile Design treatment comes with an official documented Warranty and a USD Authentication Card.

Warranty duration varies depending on the specific restoration and treatment plan, but our 3 main warranty tiers are:
1. 10 Years Warranty
2. 25 Years Warranty
3. Lifetime Warranty

How to check and verify your warranty:
You can easily check and verify your warranty on our official website by visiting the "Verify Warranty" section. Simply enter the unique verification number from your USD Authentication Card provided by your USD Certified Smile Designer. This will show you your complete restoration details, ADE laboratory craft certification, and active warranty status. Your USD Certified Smile Designer provides the official documentation and authentication card upon treatment completion.


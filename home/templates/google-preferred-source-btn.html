<a class="gps-btn"
   href="https://www.google.com/preferences/source?q=ultimatesmiledesign.com"
    rel="noopener"
   aria-label="Add Ultimate Smile Design as a preferred source on Google">
  <svg class="gps-btn__logo" viewBox="0 0 48 48" width="20" height="20" aria-hidden="true" focusable="false">
    <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/>
    <path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/>
    <path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/>
    <path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/>
  </svg>
  <span class="gps-btn__text">Add USD to Preferred Sources</span>
</a>
<style>
  .gps-btn {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    flex-shrink: 0;
    height: 40px;
    padding: 0 16px 0 12px;
    background: #1f1f20;
    border: 1px solid #8e918f;
    border-radius: 20px;
    color: #e3e3e3 !important;
    font-family: "Google Sans", Roboto, Arial, sans-serif;
    font-size: 14px;
    font-weight: 500;
    line-height: 20px;
    letter-spacing: .25px;
    text-decoration: none !important;
    white-space: nowrap;
    transition: background-color .2s, border-color .2s;
  }
  .gps-btn:hover { background: #131314; border-color: #c4c7c5; }
  .gps-btn:focus-visible { outline: 2px solid #a8c7fa; outline-offset: 2px; }
  .gps-btn__logo { flex-shrink: 0; display: block; }
  @media (max-width: 360px) {
    .gps-btn { font-size: 13px; padding: 0 12px 0 10px; }
  }
</style>
<script>
  (function () {
    if (window.__gpsBtnBound) return;
    window.__gpsBtnBound = true;

    document.addEventListener('click', function (e) {
      var btn = e.target.closest && e.target.closest('.gps-btn');
      if (!btn) return;
      e.preventDefault();

      // Official Google SDK loaded: opens Google's popup and shows Google's toast on success.
      var ps = window.PREFERRED_SOURCE;
      if (ps && ps.api && typeof ps.api.addPreferredSource === 'function') {
        if (!window.__gpsThemeSet && typeof ps.api.init === 'function') {
          ps.api.init({ theme: 'dark' }); // dark theme for Google's popup + toast
          window.__gpsThemeSet = true;
        }
        ps.api.addPreferredSource();
        return;
      }

      // Fallback (SDK blocked / not loaded yet): open the same Google page in a centered popup.
      var w = 500, h = 650;
      var left = (window.screenX || 0) + Math.max(0, (window.outerWidth - w) / 2);
      var top = (window.screenY || 0) + Math.max(0, (window.outerHeight - h) / 2);
      var popup = window.open(btn.href, 'gps_popup',
        'width=' + w + ',height=' + h + ',left=' + left + ',top=' + top + ',resizable=yes,scrollbars=yes');
      if (!popup) window.location.href = btn.href;
    });
  })();
</script>
